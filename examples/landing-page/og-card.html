<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(700px 420px at 95% 0%,#ffc58f,transparent 60%),radial-gradient(600px 400px at 0% 100%,#d9ccff,transparent 60%),#fff8ec;font-family:Nunito,sans-serif;color:#1f2440;display:grid;grid-template-columns:580px 520px;gap:24px;align-items:center;padding:0 0 0 64px;box-sizing:border-box}
.pill{display:inline-block;background:#fff;border:3px solid #f1dcb6;border-radius:999px;padding:8px 18px;font-weight:800;font-size:20px;letter-spacing:.05em;color:#0d6b40;text-transform:uppercase}
h1{font:700 84px/1.02 Fredoka,sans-serif;margin:22px 0 18px} h1 span{color:#ff8a3d;display:inline-block;transform:rotate(-3deg)}
p{font-size:28px;line-height:1.35;color:#4b5175;margin:0 0 22px;font-weight:600}
.brands{display:flex;gap:14px;font:700 26px Fredoka,sans-serif} .brands b{padding:8px 18px;border-radius:999px;border:3px solid #1f2440;box-shadow:0 5px 0 #1f2440}
.art{width:500px;height:333px;border-radius:36px;overflow:hidden;border:6px solid #fff;box-shadow:0 18px 40px rgba(31,36,64,.18);background:linear-gradient(160deg,#ffd59e,#ff9f6b 55%,#7a5cff)} .art svg{width:100%;height:100%;display:block}
</style></head><body>
<div><span class="pill">Hosted on the c0mpute network</span>
<h1>The future of <span>hosting</span></h1>
<p>Websites that live on everyone's computer. Three self-healing copies, no server.</p>
<div class="brands"><b style="background:#2bb673">c0mpute</b><b style="background:#ffb067">d1sks</b><b style="background:#b9a6ff">Infernet</b></div></div>
<div class="art"><svg viewBox="0 0 600 400" role="img" aria-label="A cheerful round robot carrying a glowing website across a town of friendly computer houses">
        <defs>
          <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6c2"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
          <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9fff3"/><stop offset="1" stop-color="#9be8c0"/></linearGradient>
          <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9f8ff"/></linearGradient>
        </defs>
        <circle cx="470" cy="90" r="120" fill="url(#sun)"/>
        <path d="M0 300 Q150 250 300 290 T600 280 V400 H0Z" fill="#6c4fd6" opacity=".55"/>
        <path d="M0 330 Q170 290 320 325 T600 315 V400 H0Z" fill="#4d38a8"/>
        <!-- houses: little computers -->
        <g>
          <rect x="40" y="250" width="90" height="70" rx="14" fill="#ffd166"/><rect x="55" y="262" width="60" height="38" rx="8" fill="#1f2440"/><circle cx="74" cy="281" r="5" fill="#7ff0b4"/><circle cx="96" cy="281" r="5" fill="#7ff0b4"/><path d="M75 291 Q85 297 95 291" stroke="#7ff0b4" stroke-width="3" fill="none" stroke-linecap="round"/>
          <rect x="470" y="245" width="100" height="78" rx="16" fill="#ff8fab"/><rect x="486" y="258" width="68" height="42" rx="9" fill="#1f2440"/><circle cx="508" cy="279" r="5" fill="#7ff0b4"/><circle cx="532" cy="279" r="5" fill="#7ff0b4"/><path d="M509 290 Q520 297 531 290" stroke="#7ff0b4" stroke-width="3" fill="none" stroke-linecap="round"/>
          <rect x="150" y="272" width="70" height="56" rx="12" fill="#8ecbff"/><rect x="162" y="282" width="46" height="30" rx="7" fill="#1f2440"/><circle cx="177" cy="297" r="4" fill="#7ff0b4"/><circle cx="193" cy="297" r="4" fill="#7ff0b4"/>
        </g>
        <!-- glowing links between houses -->
        <path d="M85 250 Q200 160 300 205 T520 245" stroke="#7ff0b4" stroke-width="4" fill="none" stroke-dasharray="2 12" stroke-linecap="round"/>
        <!-- robot -->
        <g transform="translate(250 120)">
          <ellipse cx="60" cy="205" rx="62" ry="12" fill="#000" opacity=".18"/>
          <rect x="18" y="70" width="84" height="100" rx="40" fill="url(#body)" stroke="#1f2440" stroke-width="5"/>
          <circle cx="60" cy="58" r="50" fill="url(#body)" stroke="#1f2440" stroke-width="5"/>
          <rect x="24" y="36" width="72" height="40" rx="20" fill="#1f2440"/>
          <circle cx="45" cy="56" r="9" fill="#7ff0b4"/><circle cx="75" cy="56" r="9" fill="#7ff0b4"/>
          <circle cx="48" cy="52" r="3" fill="#fff"/><circle cx="78" cy="52" r="3" fill="#fff"/>
          <path d="M48 92 Q60 102 72 92" stroke="#1f2440" stroke-width="5" fill="none" stroke-linecap="round"/>
          <line x1="60" y1="8" x2="60" y2="-12" stroke="#1f2440" stroke-width="5"/><circle cx="60" cy="-16" r="9" fill="#ff8a3d" stroke="#1f2440" stroke-width="4"/>
          <rect x="28" y="168" width="22" height="30" rx="10" fill="#9be8c0" stroke="#1f2440" stroke-width="5"/><rect x="70" y="168" width="22" height="30" rx="10" fill="#9be8c0" stroke="#1f2440" stroke-width="5"/>
          <!-- carried web page -->
          <g transform="translate(95 40) rotate(8)">
            <rect x="0" y="0" width="120" height="90" rx="12" fill="url(#page)" stroke="#1f2440" stroke-width="5"/>
            <rect x="0" y="0" width="120" height="20" rx="10" fill="#2f8cff" stroke="#1f2440" stroke-width="5"/>
            <rect x="14" y="32" width="70" height="9" rx="4" fill="#ff8a3d"/><rect x="14" y="48" width="92" height="7" rx="3" fill="#b9c0dd"/><rect x="14" y="61" width="80" height="7" rx="3" fill="#b9c0dd"/>
          </g>
          <path d="M100 110 Q125 100 120 80" stroke="#1f2440" stroke-width="10" fill="none" stroke-linecap="round"/>
        </g>
      </svg></div></body></html>

# c0mpute plugin manifest. See dips/0006-module-model.md.
#
# Built in: `c0mpute train lora` (node/crates/c0mpute-cli/src/train.rs and
# c0mpute-core/src/train.rs) is the front door to the LoRA training c0mpute
# already runs as the `infernet.text.train` workload (c0mpute-core/src/text.rs,
# DIP-0027). It does not add a second trainer:
#
#   1. checks the dataset: UTF-8 JSONL, one object per line as {text, title?},
#      {prompt, completion} or {messages: [{role, content}]}; at least 2
#      records, at most 1,000,000 records, 1 MiB per record, 512 MiB in all;
#   2. converts it to the corpus the worker's peft runner reads: {title, text}
#      stays a "Brief me on: <title>" exchange; prompt/completion and messages
#      become whole conversations ({messages: [...]}, every turn in order) that
#      the runner renders with the base model's chat template and trains with
#      the loss on the assistant turns only;
#   3. writes the @infernetprotocol/training job (kind "lora", base_model,
#      hyperparams lr / epochs / lora_r / seq_len / batch_size / max_steps);
#   4. auctions it through text::train PEER TO PEER: the corpus goes out as
#      content-addressed 1 MiB pieces the worker pulls over libp2p, progress
#      comes back as gossip on the job topic, and the adapter comes back as
#      pieces behind a manifest whose hash the receipt carries; the buyer keeps
#      the adapter only if its sha256 matches. Nothing needs a reachable HTTP
#      address (`--legacy-http` additionally serves workers from before the pieces transport over HTTP);
#   5. prints how to use it: `c0mpute infernet text chat --adapter <out>`, which
#      is peer to peer the same way (adapter out as pieces, answer back as a chunk).
#
# Worker side: `c0mpute infernet text serve`. c0mpute moves the data and hands
# Infernet's trainer local file paths; the training itself needs Infernet with
# the peft runtime (`infernet model runtime setup --peft --yes`: torch +
# transformers + peft in Infernet's venv). A corpus with conversations goes
# only to workers whose runner reports the `messages` dataset format (tag
# infernet:text:format:messages, Infernet with infernetprotocol/infernet-protocol#161
# "peft: train multi-turn conversations"); older runners would drop them. Training is
# fp32 LoRA on CPU or a CUDA GPU when torch sees one (buyers can require it with
# --gpu); no GPU is required, so keep base models small (0.5B-class trains on
# CPU in hours).
#
# Replicated verification (opt in, `--replicas 3`, or `"replicas": 3` in the
# job file for `c0mpute infernet text train`): the same corpus, seed and step
# count run on N distinct workers; the buyer downloads every adapter, measures
# the relative distance between the weight deltas (dW = B @ A per module,
# computed exactly from rank-by-rank products), and keeps the medoid of a
# group that a strict majority agrees on within `--replica-tolerance`
# (default 0.30). Step counts and final eval perplexity must also match.
# Outliers' workers are benched in the buyer's penalty box
# (<data dir>/train-penalties.json); no majority fails the job and benches
# nobody. Replicas are never bit-identical (CPU vs CUDA dropout masks, BLAS
# reduction order), hence a tolerance. Each replica is its own job capped at
# --max-price, so N replicas cost up to N times one job. Default stays 1
# replica: no cost change. See node/crates/c0mpute-core/src/train_verify.rs.
#
# No QLoRA: the peft runner loads the base model in fp32 with no 4-bit
# quantization (no bitsandbytes), so `train.qlora` is not offered.

[module]
id          = "train"
name        = "Fine-tune — LoRA training"
version     = "0.3.67"
kind        = "workload"
category    = "ai"
status      = "available"
builtin     = true
description = "Fine-tune a LoRA adapter on a c0mpute worker from a JSONL dataset (text, prompt/completion or multi-turn chats, trained on every turn): dataset and adapter move peer to peer as verified pieces, live progress, then chat with it."
author      = "Profullstack"
license     = "MIT"
keywords    = ["train", "finetune", "lora", "peft", "adapter", "infernet"]

[module.requirements]
c0mpute      = ">=0.2.82"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["bin:infernet", "infernet:text:runtime:peft", "infernet:text:format:messages?", "gpu:cuda?"]

[module.workloads]
"train.lora" = { command = "lora", runs = "infernet.text.train", validation = "adapter_sha256_matches_receipt_manifest", replicated_validation = "majority_within_delta_tolerance" }

[module.dispatch]
mode = "subprocess"

[module.surfaces]
cli = "c0mpute train lora"

[module.config.defaults]
epochs     = 1
rank       = 8
lr         = 0.0002
seq_len    = 256
batch_size = 4
replicas   = 1

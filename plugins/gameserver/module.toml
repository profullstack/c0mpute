# c0mpute plugin manifest. See dips/0006-module-model.md.
#
# Built in: workloads `gameserver.start` and `gameserver.stop`
# (node/crates/c0mpute-core/src/gameserver.rs and handoff.rs, CLI
# c0mpute-cli/src/gameserver.rs).
#
# Start is an ordinary auction with a short job: the winning worker runs
# `docker create` (argv only, no shell) on a pinned image with --memory,
# --memory-swap, --cpus, --pids-limit 1024, no-new-privileges, --restart no,
# --rm and --init, a named volume for the world and a published port block
# from its range, restores a world if asked, starts it and returns
# address:port plus the expiry. Images (multi-arch index digests):
#   minecraft  itzg/minecraft-server:java21   (EULA=TRUE only with the buyer's --accept-eula)
#   factorio   factoriotools/factorio:stable-2.1.24
#   valheim    lloesche/valheim-server        (x86_64 only; buyer sets the password)
#
# Secrets: nothing secret is in the offer (spec v2). The offer carries the
# buyer's fresh X25519 key; after the accept the winner announces its own and
# the buyer seals the Valheim password and any restore key to it
# (X25519 -> HKDF-SHA256 -> AES-256-GCM, gossip-signed both ways).
#
# Stop: the start spec carries sha256(stop token); the token stays on the
# buyer's machine until `gameserver stop`, and only the worker holding that
# server bids.
#
# Backups: every `backup_mins` (default 30) and at stop or expiry the worker
# tars the world out of the volume, encrypts it to the buyer's long-term
# X25519 backup key in 1 MiB AES-GCM chunks, and stores and announces the
# chunks plus a manifest. The manifest hash is in the stop receipt and in the
# worker's status record; only the buyer can read what it names.
#
# Health and failover: workers gossip a status record per server (container
# running, latest backup) on c0mpute/gameserver/v1, signed by their peer key.
# `c0mpute gameserver watch` probes the game port (Minecraft status ping,
# Valheim Steam A2S query, Factorio UDP reachability plus a fresh "running"
# record), logs every probe (`gameserver health`), mirrors each backup to the
# buyer's machine, and after `--fail-after-secs` (default 300) of failed checks
# starts the same world on another worker from the newest backup. No
# coordinator anywhere.
#
# Expiry: the server runs under `timeout <reservation>` behind --init and
# --rm, so it stops itself at expiry even if the worker is offline then. At
# boot and on every sweep the worker kills any labelled container past its
# expiry, then backs the world up from the volume and removes it.
#
# Worker: opt-in role (`c0mpute worker start --roles ...,gameserver`), never
# default. Advertised only when `docker info` works, the node knows a public
# address ([gameserver] public_host, the gateway announce URL, or
# C0MPUTE_P2P_EXTERNAL) and a pinned image has been pulled. The operator opens
# [gameserver] port_min..port_max (default 27500-27599, TCP and UDP).
#
# Billing: one payment up front at the price the auction cleared. A failover
# is a new rental, paid the same way.

[module]
id          = "gameserver"
name        = "Game server — Minecraft / Factorio / Valheim"
version     = "0.3.36"
kind        = "workload"
category    = "infrastructure"
status      = "available"
builtin     = true
description = "Rent a Minecraft, Factorio or Valheim server on a c0mpute worker for 1-72 hours: pinned docker images with RAM and CPU limits, address:port back in seconds, a hard stop at expiry, world backups every 30 minutes encrypted to your key, and a watcher that probes the server and fails over to another worker from the latest backup."
author      = "Profullstack"
license     = "MIT"
keywords    = ["gameserver", "minecraft", "factorio", "valheim", "hosting", "docker"]

[module.requirements]
c0mpute      = ">=0.2.82"
os           = ["linux"]
arch         = ["x86_64", "aarch64"]
capabilities = ["container-runtime", "network:public-ip", "network:ingress"]
hardware     = "opt-in worker role: docker + a public IP with the port range open (TCP and UDP)"

[module.workloads]
"gameserver.start" = { command = "start", validation = "result_schema" }
"gameserver.stop"  = { command = "stop",  validation = "world_manifest_hash" }

[module.dispatch]
mode = "container"

[module.surfaces]
cli = "c0mpute gameserver"

[module.config.defaults]
port_min            = 27500
port_max            = 27599
max_servers         = 2
max_total_ram_gb    = 0
max_hours           = 24
min_usd_per_gb_hour = 0.0
games               = ["minecraft", "factorio", "valheim"]
backup_mins         = 30

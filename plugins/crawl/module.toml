# c0mpute plugin manifest. See dips/0006-module-model.md.
#
# Built into the c0mpute binary as the in-process `crawl.fetch` workload
# (static HTTP fetch, robots-aware). CLI: `c0mpute crawl fetch <url>`.
# JS-rendered pages (a Playwright/Chromium `crawl.render` workload) are not
# implemented yet and are deliberately not declared here.

[module]
id          = "crawl"
name        = "Crawl — distributed web fetching"
version     = "0.2.74"
kind        = "workload"
category    = "data"
status      = "available"
builtin     = true
description = "Decentralized web fetching pool. Static page fetches, robots-aware."
author      = "Profullstack"
license     = "MIT"
keywords    = ["crawl", "scrape", "fetch", "crawlproof"]

[module.requirements]
c0mpute      = ">=0.1.0"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["network:egress"]

[module.workloads]
"crawl.fetch" = { command = "fetch", validation = "result_schema" }

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute crawl"

[module.config.defaults]
respect_robots = true
user_agent     = "c0mpute-crawl/0.0 (+https://c0mpute.com/plugins/crawl)"
concurrency    = 8

# c0mpute plugin manifest. See dips/0006-module-model.md and
# dips/0021-ads-manager-plugin.md.
#
# First-party, compiled into the c0mpute binary. Code:
# node/crates/c0mpute-core/src/ads/ (campaign.rs, select.rs, receipt.rs,
# manage.rs). Docs: docs/ads.md.
#
# Fully peer to peer, no ad server and no registry:
#   - A campaign is a signed record: advertiser ed25519 key, campaign id =
#     hash(owner, name), seq (higher wins), creatives by blake3 hash with
#     type/size/duration, targeting (placements, categories, keywords,
#     countries), schedule, per-listener frequency cap hint, max CPM in USD,
#     landing URL. Gossiped on c0mpute/ads/v1; every gateway keeps the index
#     and re-gossips a campaign only when nobody else has lately.
#   - Creatives are a hosting site owned by the same key ("ads-<name>"):
#     three self-healing copies, fetched by any gateway with failover and
#     checked against the signed hash.
#   - select(placement, context) on each gateway: named filters, highest bid,
#     rendezvous tie-break (every gateway agrees), frequency cap per listener
#     id. GET /ads/v1/select shows the winner and why every other campaign lost.
#   - Receipts: each gateway signs per-campaign, hash-chained, append-only
#     receipt batches (impressions, VAST quartiles, clicks), keeps them in a
#     JSONL log, serves them at /ads/v1/receipts and re-gossips them when an
#     advertiser asks. `c0mpute ads report` verifies the chains and counts.
#
#   - Billing (ads/billing.rs): a budget signed into the campaign; receipts
#     carry the cleared second price; gateways sign claims over contiguous
#     ranges of their own receipt chains; verify_claim is a pure function
#     (signatures, hash chain, replay/gap, dedupe by play, frequency and
#     daily caps, self-dealing, overspend); the advertiser signs chained
#     settlements and pays each line (5% network fee, 75% show, 20% gateway;
#     95% gateway without a show) through the CoinPay rail (`coinpay wallet
#     send`), off by default. `c0mpute ads settle` dry-runs; --pay settles.
#
# Not built: OpenRTB auction. Real payouts are implemented but off by default
# and untested with real funds (see status_note).

[module]
id          = "ads-manager"
name        = "Ads Manager — shared ad operations layer"
version     = "0.2.93"
kind        = "service"
category    = "applications"
status      = "partial"
status_note = "Campaigns, selection, receipts and billing work peer to peer and are tested end to end on a fake payment rail (budgets, second-price receipts, gateway claims, verified settlements, payouts and overspend refusal). Only the switch to real money remains: real payouts go through the node's one payment rail (`payments.rs`: CoinPay payouts API, key in `$C0MPUTE_COINPAY_PAYOUT_KEY`) and stay off until the advertiser sets both `[ads] payouts = true` and `[payments] enabled = true` and runs `c0mpute ads settle --pay` (never exercised with real funds; moving third-party money needs Anthony's approval), and the 5% network fee is only owed, not sent, until `[ads] fee_payout` names c0mpute's fee wallet."
builtin     = true
description = "Peer-to-peer ad operations: advertisers sign campaigns with a budget that gossip to every gateway, creatives live on self-healing hosting copies, each gateway picks ads with an explainable second-price rule, gateways sign chained impression receipts and claim payment over them, and the advertiser verifies and pays gateways and shows through c0mpute's one payment rail. No ad server, no clearing house."
author      = "Profullstack"
license     = "MIT"
source      = "https://github.com/profullstack/c0mpute/tree/master/node/crates/c0mpute-core/src/ads"
keywords    = ["ads", "advertising", "campaigns", "p2p", "receipts", "publisher", "creative", "billing", "coinpay"]

[module.requirements]
c0mpute      = ">=0.2.82"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["network:ingress?", "network:egress", "disk"]

[module.requirements.plugins]
hosting = ">=0.2.72"   # creative storage: three self-healing copies

[module.requirements.optional_plugins]
ctv-ads            = ">=0.0.1"     # VAST 4.2 / VMAP on gateways
podcast-ads        = ">=0.0.1"     # dynamic ad insertion into hosted podcasts
ad-generator-agent = ">=0.2.53"   # makes the creative folder `--creative` takes

[module.workloads]
# None: a continuous service on every gateway, driven by gossip.

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute ads"

[module.config.defaults]
serve             = true    # [ads] serve: answer ad requests on this gateway
regossip_secs     = 600
receipt_flush_secs = 60
claim_secs        = 300     # gateways claim unsettled receipts this often
min_claim_usd     = "1.00"  # [ads] min_claim_usd
payouts           = false   # [ads] payouts: settle --pay may send real money
fee_bps           = 500     # network fee (same 5% as the market and Infernet)
publisher_bps     = 7500    # show share of each paid impression
gateway_bps       = 2000    # gateway share (95% when there is no show)

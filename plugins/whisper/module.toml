# c0mpute plugin manifest. See dips/0006-module-model.md.
#
# CPU implementation lives in c0mpute-core and uses faster-whisper with
# CTranslate2 int8 inference. Input audio is content-addressed and transferred
# over c0mpute P2P; output is JSON with transcript, language and segments.

[module]
id          = "whisper"
name        = "Whisper — speech-to-text"
version     = "0.2.91"
kind        = "workload"
category    = "ai"
status      = "available"
builtin     = true
description = "CPU speech-to-text inference over c0mpute using faster-whisper."
author      = "Profullstack"
license     = "MIT"
keywords    = ["whisper", "stt", "transcription", "speech", "audio", "subtitles"]

[module.requirements]
c0mpute      = ">=0.1.0"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["cpu"]

[module.workloads]
"stt.transcribe" = { command = "transcribe", validation = "valid_transcript_json" }

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute stt"

[module.config.defaults]
model = "base"

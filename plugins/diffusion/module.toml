# c0mpute plugin manifest. See dips/0006-module-model.md.
#
# CPU image generation. Every node with >=16 GiB RAM and >=25 GB free disk
# provisions it itself (node/crates/c0mpute-core/src/diffusion.rs): a pinned
# stable-diffusion.cpp release (MIT) plus Apache-2.0 weights from Hugging
# Face, all SHA-256 checked. Needs a per-job CPU budget of >=8 threads
# (a 16-thread box); bids only while >=12 GiB RAM is free.
# ~90-120 s per 768x512 image on a 16-core CPU. Buyers call the speech
# gateway's POST /v1/images. Opt out: C0MPUTE_DIFFUSION_AUTO=0.

[module]
id          = "diffusion"
name        = "Diffusion — image generation"
version     = "0.3.118"
kind        = "workload"
category    = "ai"
status      = "available"
builtin     = true
description = "Decentralized text-to-image on plain CPUs: Z-Image-Turbo and ChatrXL Uncensored (SDXL) through stable-diffusion.cpp, provisioned by every node with the RAM for it."
author      = "Profullstack"
license     = "MIT"
keywords    = ["diffusion", "z-image", "stable-diffusion.cpp", "image", "txt2img", "cpu"]

[module.requirements]
c0mpute      = ">=0.2.61"
os           = ["linux"]
arch         = ["x86_64"]
capabilities = ["cpu"]

[module.workloads]
"diffusion.txt2img" = { command = "txt2img", validation = "png_magic" }

[module.dispatch]
mode = "in-process"

[module.surfaces]
api = "POST /v1/images (c0mpute speech serve)"

[module.models."z-image-turbo"]
repo       = "leejet/Z-Image-Turbo-GGUF"
default    = true
params     = "6B"
precision  = "Q4_K"
resolution = "256-1024 px, multiples of 64 (default 768x512)"
workloads  = ["diffusion.txt2img"]
license    = "Apache-2.0"
backend    = "stable-diffusion.cpp"
distilled  = true

# ChatrXL Uncensored (ChatR Labs): SDXL/Pony family, the DMD2 8-step
# single-file build plus its two textual-inversion embeddings, pinned and
# SHA-256 checked in diffusion.rs. Installed in the background once
# Z-Image-Turbo works and 17 GB is free; opt out with
# C0MPUTE_DIFFUSION_CHATRXL=0. Chatr Labs Model License 1.0 allows commercial
# use and hosting; its acceptable-use rules (no CSAM, no non-consensual
# intimate imagery, no deepfakes of real people) are what content_policy
# enforces on every gateway and worker.
[module.models."chatrxl-uncensored"]
repo       = "chatrlabs/ChatrXL-Uncensored"
params     = "SDXL (2.6B UNet)"
precision  = "fp16"
resolution = "256-1024 px, multiples of 64 (chat default 960x640)"
workloads  = ["diffusion.txt2img"]
license    = "chatrlabs-model-license-1.0"
backend    = "stable-diffusion.cpp"
distilled  = true

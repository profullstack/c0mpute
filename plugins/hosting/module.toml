# c0mpute plugin manifest. See dips/0006-module-model.md.
#
# First-party, compiled into the c0mpute binary, ON BY DEFAULT (role
# `hosting`). Code: node/crates/c0mpute-core/src/hosting/. Docs:
# docs/hosting.md.
#
# Fully peer to peer, no coordinator:
#   - A site is a signed record (owner ed25519 key + name -> manifest hash,
#     version) pointing at a content-addressed manifest of 1 MiB chunks.
#   - Hosting nodes gossip what they hold on c0mpute/hosting/v1 every minute,
#     so every node knows where each site's copies are.
#   - Fewer than 3 live copies: the hosting nodes that rank highest for that
#     site (rendezvous hashing, same answer on every node) fetch a copy. A node
#     that leaves stops counting after ~200 s and another takes over; above 5
#     copies the lowest-ranked holder lets go.
#   - Every gateway is a proxy: /s/<site_id>/... and custom domains (DNS TXT
#     _c0mpute-hosting.<domain> = "site=<id>") are served from local chunks or
#     fetched over libp2p from the fastest live holder, round-robin among
#     equally fast ones, failing over to the next.
#
#   - Paid hosting: `publish --disks auto` picks preferred hosts from the d1sks
#     OpenDisk marketplace (discovery only) into a signed v2 record; they
#     replicate first, holders are challenged with random chunk fetches
#     (signed receipts on gossip), and the payer settles per GiB-month through
#     CoinPay payouts, OFF by default ([payments] enabled = false).
#
# Not yet: escrow, and proof-of-serve challenges from DIP-0015. Free hosting
# stays free.

[module]
id          = "hosting"
name        = "Hosting — p2p static sites"
version     = "0.3.38"
kind        = "service"
category    = "data"
status      = "available"
builtin     = true
description = "Static sites kept alive by the network: three self-healing copies on hosting nodes, served by every gateway at /s/<site_id>/ and on DNS-verified custom domains. Signed, content-addressed, no coordinator. Free by default; optionally pay hosts picked from the d1sks marketplace per GiB-month, with proof-of-storage challenges (settlement off until enabled)."
author      = "Profullstack"
license     = "MIT"
source      = "https://github.com/profullstack/c0mpute/tree/master/node/crates/c0mpute-core/src/hosting"
keywords    = ["hosting", "static", "p2p", "censorship-resistant", "self-healing", "dweb", "marketplace", "opendisk"]

[module.requirements]
c0mpute      = ">=0.2.82"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["disk", "network:ingress?"]

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute hosting"

[module.config.defaults]
replicas      = 3
max_replicas  = 5
max_site_mib  = 256
max_bytes_gib = 5

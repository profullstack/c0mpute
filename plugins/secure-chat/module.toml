# c0mpute plugin manifest. See dips/0006-module-model.md and
# dips/0018-secure-chat-plugin.md.
#
# Built in: crypto + client state in node/crates/c0mpute-secure-chat, the
# network service in node/crates/c0mpute-core/src/dm.rs, the CLI in
# node/crates/c0mpute-cli/src/dm_cli.rs.
#
# What runs where:
#   * Every worker/gateway serves the `mailbox` role by default: it holds
#     sealed messages for offline recipients (bounded) and caches
#     self-published key records. Mailboxes gossip on c0mpute/dm/v1 and
#     answer over the /c0mpute/rpc/1.0.0 request/response protocol.
#   * `c0mpute dm send` delivers straight to the recipient's home node when it
#     is online, otherwise stores on 3 mailboxes picked by rendezvous hashing
#     on the recipient tag. `c0mpute dm pull` polls the same nodes, opens,
#     verifies, and acks (deletes).
#
# Not in this release (DIP-0018 later phases): group chats, attachments,
# web/TUI surfaces, CoinPay DID binding, Double Ratchet forward secrecy.

[module]
id          = "secure-chat"
name        = "Secure Chat — E2E encrypted p2p messaging"
version     = "0.3.3"
kind        = "service"
category    = "applications"
status      = "available"
builtin     = true
description = "End-to-end encrypted one-to-one messages between c0mpute users, peer to peer with no central server. Your address is your public key (hybrid X25519 + ML-KEM-768 encryption, Ed25519 + ML-DSA-65 signatures). Messages go straight to the recipient's node when it is online, or wait sealed on three mailbox nodes for up to 30 days; mailboxes never see who sent a message, who it is for, or what it says. Contacts, blocklist and inbox stay on your machine, encrypted under your key. Keys are found by fingerprint from self-signed records nodes gossip. One-to-one text only for now: no group chats, attachments or web UI yet."
author      = "Profullstack"
license     = "MIT"
source      = "https://github.com/profullstack/c0mpute/tree/master/plugins/secure-chat"
keywords    = ["chat", "messaging", "e2e", "encryption", "p2p", "post-quantum", "privacy", "mailbox"]

[module.requirements]
c0mpute      = ">=0.2.83"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["network:ingress", "network:egress", "storage:ephemeral"]

[module.workloads]
# No one-shot workloads. secure-chat is a continuous service role
# (`mailbox`, on by default) driven by gossip and p2p request/response,
# not by the job dispatcher.

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute dm"
# web = "c0mpute.com/chat"   # planned
# tui = "chat panel"         # planned

[module.config.defaults]
# Longest a mailbox holds a message for an offline recipient (30 days).
offline_ttl_secs     = 2592000
# Encrypted bytes a mailbox holds per recipient tag (10 MiB) and in total (256 MiB).
max_queue_bytes      = 10485760
max_total_bytes      = 268435456
# Largest sealed message (64 KiB; message text up to 16 KiB).
max_message_bytes    = 65536
# Messages a mailbox accepts per sending peer per minute.
rate_limit_per_min   = 60
# Mailboxes each message is stored on.
store_replicas       = 3

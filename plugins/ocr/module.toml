kind        = "workload"
category    = "ai"
status      = "available"
builtin     = true
description = "Text from images and PDFs on CPU workers running Tesseract: PNG, JPEG, TIFF, WebP or PDF up to 50 pages, plain text per page, any installed Tesseract language."
author      = "Profullstack"
license     = "MIT"
keywords    = ["ocr", "tesseract", "pdf", "documents", "scan", "text-extraction"]

[module.requirements]
c0mpute      = ">=0.2.73"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["cpu", "bin:tesseract", "bin:pdftoppm?"]

[module.workloads]
"ocr.extract" = { command = "extract", validation = "result_schema" }

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute ocr"
api = "POST /v1/ocr (c0mpute speech serve)"

[module.config.defaults]
engine    = "tesseract"
languages = ["eng"]
max_pages = 50

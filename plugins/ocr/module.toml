# c0mpute plugin manifest. See dips/0006-module-model.md.
#
# Built into the c0mpute binary as the `ocr.extract` workload
# (node/crates/c0mpute-core/src/ocr.rs). Workers run the operator's own
# Tesseract (`tesseract` on PATH; `apt install tesseract-ocr poppler-utils`),
# rasterizing PDFs page by page with poppler's pdftoppm. The node installs
# nothing itself: it advertises c0mpute:role:ocr only where tesseract runs,
# and bids only on languages it has (and PDFs only with poppler).
#
# Input: a PNG, JPEG, TIFF, WebP or PDF up to 32 MiB / 50 pages, carried by
# content hash in 1 MiB pieces (input_hash + input_size + input_pieces; a
# lone input_hash is one chunk). Output: JSON
# {v, ok, text, pages: [{page, text}], engine: "tesseract", lang}.
# Buyers: `c0mpute ocr <file> [--lang eng]`, POST /v1/ocr?lang=eng on
# `c0mpute speech serve` (raw bytes body), or the jobs bridge by hash.
# Not built yet: layout boxes / confidences, searchable-PDF output, GPU
# engines (PaddleOCR, docTR), cross-worker spot checks.

[module]
id          = "ocr"
name        = "OCR — document text extraction"

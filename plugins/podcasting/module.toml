# c0mpute plugin manifest. See dips/0006-module-model.md and
# dips/0022-podcast-plugins.md.
#
# First-party, compiled into the c0mpute binary. Code:
# node/crates/c0mpute-core/src/podcast/show.rs. Built ON hosting
# (plugins/hosting): a podcast is a hosting site.
#
# `c0mpute podcasting publish <show-folder|audio files> --name <show>`:
#   - reads show.toml / episodes.toml (or flags), probes durations with
#     ffprobe when installed,
#   - writes feed.xml (RSS 2.0 + iTunes + Podcasting 2.0: enclosures with
#     length + type, guid, pubDate, itunes tags, podcast:guid = uuid v5 of the
#     site id, podcast:locked, podcast:value only when an address is given),
#     index.html (an episode page with players) and the audio,
#   - signs and publishes it as hosting site <name> (a new version each
#     publish): three self-healing copies, served by every gateway at
#     /s/<site_id>/feed.xml (application/rss+xml) and on DNS-verified domains.
#
# Not yet (DIP-0022 scope that is not built): live episodes
# (podcast:liveItem), auto-transcription, transcoding on publish, CoinPay
# subscriptions / pay-per-episode / ads. Shows are bounded by hosting's
# 256 MiB per-site limit.

[module]
id          = "podcasting"
name        = "Podcasting — p2p podcast publishing"
version     = "0.3.8"
kind        = "service"
category    = "media"
status      = "available"
builtin     = true
description = "Publish a podcast as a self-healing p2p site: an RSS 2.0 + Podcasting 2.0 feed (works in every podcast app), an episode page and the audio, kept on three hosting nodes and served by every c0mpute gateway and on your own domain. No coordinator, no platform cut. Shows up to 256 MiB; live episodes and paid tiers are not built yet."
author      = "Profullstack"
license     = "MIT"
source      = "https://github.com/profullstack/c0mpute/tree/master/node/crates/c0mpute-core/src/podcast"
keywords    = ["podcast", "podcasting", "rss", "audio", "publishing", "censorship-resistant", "podcasting2", "p2p"]

[module.requirements]
c0mpute      = ">=0.2.76"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["network:egress"]

[module.requirements.plugins]
hosting = ">=0.2.72"   # the show is a hosting site

[module.workloads]
# None: publishing is client-side; hosting nodes keep and serve the show.

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute podcasting"

[module.config.defaults]
# Default episode type when episodes.toml does not say.
default_episode_type = "full"
# podcast:locked unless --unlocked.
locked               = true

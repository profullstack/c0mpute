# c0mpute plugin manifest. See dips/0006-module-model.md and
# dips/0020-ctv-ads-plugin.md.
#
# First-party, compiled into the c0mpute binary, on every gateway. Code:
# node/crates/c0mpute-core/src/ads/vast.rs (+ routes in ads/mod.rs). Docs:
# docs/ads.md. Campaigns come from ads-manager (signed, gossiped).
#
#   GET /ads/v1/vast?placement=ctv_preroll|ctv_midroll|ctv_postroll
#       &uid=<device id>&categories=..&keywords=..&country=..&floor=<usd>
#     -> VAST 4.2 InLine (AdSystem, Error, Impression, AdServingId, AdTitle,
#        Creative + UniversalAdId, Linear Duration, TrackingEvents,
#        VideoClicks, progressive MediaFile), or the empty <VAST/> on no fill.
#   GET /ads/v1/vmap?breaks=start,600,end  -> VMAP 1.0, one VAST tag per break.
#   GET /ads/v1/creative/<campaign>/<hash>  -> the video from the hosting
#       swarm, hash-checked, with Range support.
#   GET /ads/v1/t?ev=impression|start|firstQuartile|midpoint|thirdQuartile|
#       complete|click&tok=..  -> a signed receipt (ads-manager), once per
#       play and event; tokens are HMAC'd by the gateway that served the ad.
#   Also at /ads/vast and /ads/vmap. CORS open, so web players can call them.
#
# Not built: OpenRTB bidding, SCTE-35 / live-stream SSAI, beacon timing
# checks, and billing (see ads-manager).

[module]
id          = "ctv-ads"
name        = "CTV Ads — VAST and VMAP from every gateway"
version     = "0.2.79"
kind        = "service"
category    = "applications"
status      = "partial"
status_note = "VAST 4.2 / VMAP ad serving with signed impression and quartile receipts works on every gateway; there is no billing, OpenRTB bidding or live-stream (SCTE-35) insertion yet."
builtin     = true
description = "Video ads for connected TV and web players: every c0mpute gateway answers VAST 4.2 and VMAP requests from the gossiped campaign index, serves the video creative from hosting copies, and turns impression, quartile and click beacons into signed receipts."
author      = "Profullstack"
license     = "MIT"
source      = "https://github.com/profullstack/c0mpute/tree/master/node/crates/c0mpute-core/src/ads"
keywords    = ["ctv", "connected-tv", "advertising", "vast", "vmap", "video", "streaming", "p2p"]

[module.requirements]
c0mpute      = ">=0.2.78"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["network:ingress"]

[module.requirements.plugins]
ads-manager = ">=0.0.1"     # campaigns, selection, receipts
hosting     = ">=0.2.72"   # creative storage

[module.workloads]
# None: gateway routes.

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute ads"

[module.config.defaults]
vast_version = "4.2"

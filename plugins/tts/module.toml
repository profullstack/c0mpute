# c0mpute plugin manifest. See dips/0006-module-model.md.
#
# CPU implementation lives in c0mpute-core. The node installs the selected
# runtimes and model files into its per-user data directory; no API key or GPU
# is required. Piper runtime is GPL-3.0; the selected Piper voice files have
# individual licenses. Kokoro model files are Apache-2.0. Pocket TTS weights are
# CC-BY-4.0; most enabled Pocket preset voices are CC0, while Alba and Anna are
# CC-BY-4.0.
#
# Kokoro (an int8 ONNX export of hexgrad/Kokoro-82M) is the engine every node
# carries: a worker provisions it in the background until it succeeds, giving
# it its own virtualenv when the box's Python is too new for kokoro-onnx.
# `c0mpute tts auto off` opts out.

[module]
id          = "tts"
name        = "TTS — text-to-speech"
version     = "0.3.39"
kind        = "workload"
category    = "ai"
status      = "available"
builtin     = true
description = "CPU text-to-speech inference over c0mpute using Piper, Kokoro, or Pocket TTS."
author      = "Profullstack"
license     = "MIT"
keywords    = ["tts", "piper", "kokoro", "pocket-tts", "synthesis", "audio"]

[module.requirements]
c0mpute      = ">=0.1.0"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["cpu"]

[module.workloads]
"tts.synthesize" = { command = "synthesize", validation = "valid_wav_and_size" }

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute tts"

[module.config.defaults]
engine = "kokoro"
voice  = "af_sarah"
format = "wav"

# c0mpute plugin manifest. See dips/0006-module-model.md.
#
# CPU implementation lives in c0mpute-core. The node installs the selected
# runtimes and model files into its per-user data directory; no API key or GPU
# is required. Piper runtime is GPL-3.0; the selected Piper voice files have
# individual licenses. Kokoro model files are Apache-2.0.

[module]
id          = "tts"
name        = "TTS — text-to-speech"
version     = "0.2.45"
kind        = "workload"
category    = "ai"
description = "CPU text-to-speech inference over c0mpute using Piper or Kokoro."
author      = "Profullstack"
license     = "MIT"
keywords    = ["tts", "piper", "xtts", "kokoro", "synthesis", "audio"]

[module.requirements]
c0mpute      = ">=0.1.0"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["cpu"]

[module.workloads]
"tts.synthesize" = { command = "synthesize", validation = "valid_wav_and_size" }

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute tts"

[module.config.defaults]
engine = "kokoro"
voice  = "af_sarah"
format = "wav"

# c0mpute plugin manifest. See dips/0006-module-model.md and
# dips/0022-podcast-plugins.md.
#
# First-party, compiled into the c0mpute binary. Code:
# node/crates/c0mpute-core/src/podcast/listen.rs (+ rss.rs, the feed reader).
#
#   c0mpute podcasts subscribe <feed-url|site_id>
#   c0mpute podcasts ls
#   c0mpute podcasts episodes <show>
#   c0mpute podcasts download <show> [episode] [--dir D]
#   c0mpute podcasts play <show> [episode]        (mpv or ffplay; else prints the path)
#
# c0mpute shows are read through a gateway (/s/<site_id>/feed.xml, default the
# local node on 127.0.0.1:7777) or, with --p2p, through a hosting client the
# CLI runs itself. Any other feed and every enclosure outside the gateway are
# fetched with the worker outbound guard: each redirect hop must resolve to
# public addresses only, pinned against DNS rebinding. Subscriptions persist
# in <data_dir>/podcasts/subscriptions.json.
#
# Not yet (DIP-0022 scope that is not built): OPML import/export, the local
# :9090 proxy for other apps, background polling/notifications, seeding
# downloads back to the swarm, live shows, CoinPay tips / value-for-value.

[module]
id          = "podcasts"
name        = "Podcasts — p2p podcast listener"
version     = "0.2.98"
kind        = "service"
category    = "media"
status      = "available"
builtin     = true
description = "Subscribe to podcasts hosted on the c0mpute network or any standard RSS feed, list episodes, download and play them from the CLI. c0mpute shows are read through any gateway or straight from the p2p network. OPML, background polling and tipping are not built yet."
author      = "Profullstack"
license     = "MIT"
source      = "https://github.com/profullstack/c0mpute/tree/master/node/crates/c0mpute-core/src/podcast"
keywords    = ["podcast", "listen", "subscribe", "rss", "audio", "p2p", "podcasting2"]

[module.requirements]
c0mpute      = ">=0.2.76"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["network:egress"]

[module.workloads]
# None: a client. Shows come from hosting nodes via gateways.

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute podcasts"

[module.config.defaults]
gateway = "http://127.0.0.1:7777"

# c0mpute plugin manifest. See dips/0006-module-model.md.
#
# Containerized video-generation workload: text-to-video and image-to-video.
# The runner lives at plugins/video/runner (Dockerfile + runner.py) and is
# published as the image below; the node's video runner invokes it per job and
# reads files, never stdout. See that directory's README for the job contract.
#
# The image below is a convenience: `c0mpute video setup` falls back to
# building it from this public repo when the registry will not serve it, so a
# node with a GPU never needs a registry account.
#
#   Backend: Diffusers, not ComfyUI. ComfyUI would mean shipping hand-authored
#   API graph JSON per model, which cannot be checked by reading it; the
#   diffusers pipelines take the Wan repos directly, so the model set below is
#   the whole configuration. Each model therefore carries `diffusers_repo`
#   alongside the canonical `repo`.
#
#   Weights: pulled from Hugging Face into the runner's /weights cache on
#   first use. Moving that to the c0mpute storage plugin (DIP-0012) is the
#   next step and matters more than it sounds — the default model's cold pull
#   is a measured 32 GB, and a rented card bills for every minute of it.
#
#   Validation: schema + ffprobe (codec, dimensions, frame count, duration) —
#   a generated clip is not reproducible across workers, so no cross-worker
#   hash check and no perceptual spot-check. Pay on a receipt from a single
#   worker, as with render.
#
#   Model choice: Wan 2.2 (Apache-2.0, so commercial use is clean) is the
#   default family. HunyuanVideo was the other candidate — quality is
#   comparable, but it is markedly slower per clip, which is the wrong trade
#   on a network billing by the second.
#
#   Video WITH sound: LTX-2.3 (Lightricks) generates the clip and a
#   synchronized 48 kHz stereo soundtrack in one pass. We take the distilled
#   diffusers repo: ungated (no per-node Hugging Face token), 8 steps, no CFG.
#   Its weights are NOT Apache: the LTX-2 Community License is worldwide and
#   royalty-free for entities under $10M annual revenue, allows hosting as a
#   service (s.3), and requires its Attachment A use restrictions to be in our
#   terms and outputs to be disclosed as machine generated. A node operator
#   at $10M+ revenue needs their own commercial license from Lightricks.
#   Rejected: HyperFlow H3 / MiniMax H3 (license excludes the US, EU, UK and
#   Korea), Ovi and Kandinsky 6 (both load MMAudio weights, CC-BY-NC).

[module]
id          = "video"
name        = "Video — generation (Wan 2.2, LTX-2.3 with audio)"
version     = "0.2.63"
kind        = "workload"
category    = "ai"
description = "Decentralized video generation on consumer/prosumer GPUs: Wan 2.2 text/image-to-video, and LTX-2.3 video with a synchronized soundtrack."
author      = "Profullstack"
license     = "MIT"
keywords    = ["video", "wan", "wan2.2", "ltx-2", "ltx-2.3", "audio", "txt2vid", "img2vid", "generation", "diffusion"]

[module.requirements]
c0mpute      = ">=0.1.0"
os           = ["linux"]
arch         = ["x86_64"]
capabilities = ["gpu:nvidia", "model-runtime", "container-runtime"]

[module.workloads]
"video.txt2vid" = { command = "txt2vid", validation = "schema_and_ffprobe" }
"video.img2vid" = { command = "img2vid", validation = "schema_and_ffprobe" }

# Model options. `vram_gib` is the floor for the stated precision — the
# number a provider's advert has to beat to be matched to a job, not a
# benchmark. The Wan weights are Apache-2.0; LTX-2.3 is under the LTX-2
# Community License (see the header). The plugin itself is MIT.
#
# `backend` picks the diffusers pipeline family (default "wan"); `audio`
# means the clip carries a soundtrack, and the runner refuses to return one
# without it. LTX-2 needs frames = 8k+1 and width/height divisible by 32.
[module.models]
"wan2.2-ti2v-5b" = { repo = "Wan-AI/Wan2.2-TI2V-5B", diffusers_repo = "Wan-AI/Wan2.2-TI2V-5B-Diffusers", default = true, params = "5B", precision = "fp16", vram_gib = 24, resolution = "720p@24fps", workloads = ["video.txt2vid", "video.img2vid"], license = "apache-2.0" }
"wan2.2-t2v-a14b" = { repo = "Wan-AI/Wan2.2-T2V-A14B", diffusers_repo = "Wan-AI/Wan2.2-T2V-A14B-Diffusers", params = "14B MoE", precision = "fp8", vram_gib = 48, resolution = "720p@24fps", workloads = ["video.txt2vid"], license = "apache-2.0" }
"wan2.2-i2v-a14b" = { repo = "Wan-AI/Wan2.2-I2V-A14B", diffusers_repo = "Wan-AI/Wan2.2-I2V-A14B-Diffusers", params = "14B MoE", precision = "fp8", vram_gib = 48, resolution = "720p@24fps", workloads = ["video.img2vid"], license = "apache-2.0" }
"ltx2.3-av-distilled" = { repo = "Lightricks/LTX-2.3", diffusers_repo = "diffusers/LTX-2.3-Distilled-Diffusers", backend = "ltx2", audio = true, distilled = true, params = "22B", precision = "bf16", vram_gib = 48, resolution = "768x512@24fps + 48kHz stereo", workloads = ["video.txt2vid", "video.img2vid"], license = "ltx-2-community" }

[module.dispatch]
mode  = "container"
image = "ghcr.io/profullstack/c0mpute-video-runner:candidate"

[module.surfaces]
cli = "c0mpute video"

[module.config.defaults]
model     = "wan2.2-ti2v-5b"
frames    = 81
fps       = 24
steps     = 30
container = "mp4"

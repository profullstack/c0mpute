# c0mpute plugin manifest. See dips/0006-module-model.md.
#
# CANDIDATE plugin — implementation not yet scaffolded.
# Brief for the implementer:
#   Containerized video-generation workload: text-to-video and
#   image-to-video. Suggested upstreams: ComfyUI (the Wan 2.2 reference
#   graphs ship with it) or Diffusers. Container pins the model set in
#   [module.models]; jobs name a model id and the runner pulls weights
#   from the c0mpute storage plugin (DIP-0012) rather than Hugging Face
#   at job time. Output is one MP4 (H.264 or AV1) plus a metadata
#   sidecar; hand the clip to the transcode plugin for other renditions.
#   Validation: schema + ffprobe (duration, fps, dimensions) — a
#   generated clip is not reproducible across workers, so no
#   cross-worker hash check and no perceptual spot-check. Pay on a
#   receipt from a single worker, as with render.
#
#   Model choice: Wan 2.2 (Apache-2.0, so commercial use is clean) is
#   the default family. HunyuanVideo was the other candidate — quality
#   is comparable, but it is markedly slower per clip, which is the
#   wrong trade on a network billing by the second.

[module]
id          = "video"
name        = "Video — generation (Wan 2.2)"
version     = "0.2.60"
kind        = "workload"
category    = "ai"
description = "Decentralized video generation (Wan 2.2 text-to-video and image-to-video) on consumer/prosumer GPUs."
author      = "Profullstack"
license     = "MIT"
keywords    = ["video", "wan", "wan2.2", "txt2vid", "img2vid", "generation", "diffusion"]

[module.requirements]
c0mpute      = ">=0.1.0"
os           = ["linux"]
arch         = ["x86_64"]
capabilities = ["gpu:nvidia", "model-runtime", "container-runtime"]

[module.workloads]
"video.txt2vid" = { command = "txt2vid", validation = "schema_and_ffprobe" }
"video.img2vid" = { command = "img2vid", validation = "schema_and_ffprobe" }

# Model options. `vram_gib` is the floor for the stated precision — the
# number a provider's advert has to beat to be matched to a job, not a
# benchmark. Weights are Apache-2.0 for every variant here; the plugin
# itself is MIT.
[module.models]
"wan2.2-ti2v-5b" = { repo = "Wan-AI/Wan2.2-TI2V-5B", default = true, params = "5B", precision = "fp16", vram_gib = 24, resolution = "720p@24fps", workloads = ["video.txt2vid", "video.img2vid"], license = "apache-2.0" }
"wan2.2-t2v-a14b" = { repo = "Wan-AI/Wan2.2-T2V-A14B", params = "14B MoE", precision = "fp8", vram_gib = 48, resolution = "720p@24fps", workloads = ["video.txt2vid"], license = "apache-2.0" }
"wan2.2-i2v-a14b" = { repo = "Wan-AI/Wan2.2-I2V-A14B", params = "14B MoE", precision = "fp8", vram_gib = 48, resolution = "720p@24fps", workloads = ["video.img2vid"], license = "apache-2.0" }

[module.dispatch]
mode  = "container"
image = "ghcr.io/c0mpute/video-runner:candidate"

[module.surfaces]
cli = "c0mpute video"

[module.config.defaults]
model     = "wan2.2-ti2v-5b"
frames    = 81
fps       = 24
steps     = 30
container = "mp4"

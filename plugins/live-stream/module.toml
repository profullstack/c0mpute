# c0mpute plugin manifest. See dips/0006-module-model.md and
# dips/0019-live-stream-plugin.md.
#
# First-party, compiled into the c0mpute binary, ON BY DEFAULT (role
# `live-stream`). Code: node/crates/c0mpute-core/src/live/.
#
# Fully peer to peer, no coordinator:
#   - Broadcaster: `c0mpute stream go <input> --name <stream>` runs the local
#     ffmpeg into HLS (MPEG-TS segments, 2-10 s, rolling window; codec copy
#     when the input allows, libx264 otherwise; optional 480p second
#     rendition). Input is a file, an ffmpeg URL (rtmp://, srt://, udp://...,
#     `--listen` to receive a push) or `-` for stdin. RTMP/SRT ingest is
#     ffmpeg's, so the broadcaster needs ffmpeg; relays and viewers do not.
#   - Each new segment goes into the chunk store (1 MiB chunks) and the
#     stream's signed live record (ed25519 owner key from <data_dir>/buyer,
#     stream_id = hash(owner, name), increasing seq) is gossiped on
#     c0mpute/live/v1 with the playlist window: segment hashes, durations,
#     media and discontinuity sequence. A few KiB per message, under 64 KiB
#     worst case.
#   - Every live-stream node verifies records; gateways serve
#     /live/<stream_id>/index.m3u8 (media playlist, or a master playlist for
#     two renditions) and /live/<stream_id>/<segment_hash>.ts. Segments are
#     fetched over libp2p from any peer that holds them (Have gossip), relays
#     before the broadcaster, fastest first, failing over to the next. A relay
#     that fetched a segment holds and re-serves it for the live window, so
#     load spreads swarm-style; segments that leave the window are evicted.
#     Streams with viewers get their newest segments prefetched.
#   - `c0mpute stream watch <id>` prints the gateway URL and plays it in mpv
#     or ffplay; `c0mpute stream ls` lists streams a gateway knows.
#
# Not yet (DIP-0019): fMP4/LL-HLS, DVR/replay, per-GB CoinPay settlement, an
# in-browser player page. Free while in beta.

[module]
id          = "live-stream"
name        = "Live Stream — p2p HLS live streaming"
version     = "0.3.2"
kind        = "service"
category    = "media"
status      = "available"
builtin     = true
description = "Peer-to-peer HLS live streaming: broadcast a file, RTMP/SRT feed or stdin with `c0mpute stream go` (needs ffmpeg), and every gateway serves /live/<stream_id>/index.m3u8 to any HLS player. Signed live windows over gossip; relays swarm segments from each other instead of the broadcaster. No coordinator, no CDN. Free in beta."
author      = "Profullstack"
license     = "MIT"
source      = "https://github.com/profullstack/c0mpute/tree/master/node/crates/c0mpute-core/src/live"
keywords    = ["live", "streaming", "hls", "m3u8", "p2p", "bittorrent", "rtmp", "srt", "video"]

[module.requirements]
c0mpute      = ">=0.2.77"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
# ffmpeg is needed only to broadcast (RTMP/SRT/file/stdin ingest); relays
# and viewers need nothing.
capabilities = ["network:egress", "network:ingress?", "ffmpeg?"]

[module.workloads]
# None: live-stream is a continuous gossip service, not a dispatched job.

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute stream"

[module.config.defaults]
segment_duration_secs = 4
window_segments       = 6
renditions            = ["src", "480p (--low)"]
segment_container     = "mpegts"

# c0mpute plugin manifest. See dips/0006-module-model.md and
# dips/0023-podcast-ads-plugin.md.
#
# First-party, compiled into the c0mpute binary, on every gateway. Code:
# node/crates/c0mpute-core/src/ads/stitch.rs (+ the hosting serve hook in
# ads/mod.rs). Docs: docs/ads.md. Campaigns come from ads-manager.
#
# Consent: a show takes ads only if its own hosting site carries
# c0mpute-ads.json (written by `c0mpute podcasting publish --ads pre,mid,post`
# or an [ads] table in show.toml). The site record is signed by the show's
# owner and pins that file by hash, so no gateway can add ads to a show that
# did not opt in. Opted-in feeds point players at episodes/<file>?ads=1.
#
# Insertion: on /s/<site>/episodes/<file>?ads=1 a gateway picks one campaign
# per break the show sells (podcast_pre / podcast_mid / podcast_post), fetches
# the audio creative from hosting, and splices it in with its own ffmpeg
# (resample to the episode's rate and layout, concat filter, re-encode in the
# episode's format), serves it with the right Content-Length and Range
# support, reuses it for the same listener for 10 minutes, and signs an
# impression receipt per ad. No ffmpeg, no fill or any failure: the clean
# episode, with x-c0mpute-ads saying why.
#
# Payout: a show names `payout = "<COIN>:<address>"` in [ads] (or
# --ads-payout); it is inside the signed opt-in, so no gateway can redirect
# it. Each paid impression on the show pays it 75% of the cleared price
# (ads-manager billing). A show without a payout runs ads unpaid.
#
# Not built: DAAST endpoint, <podcast:value> split injection, host-read
# slots.

[module]
id          = "podcast-ads"
name        = "Podcast Ads — dynamic ad insertion"
version     = "0.3.36"
kind        = "service"
category    = "applications"
status      = "partial"
status_note = "Dynamic ad insertion into opted-in podcasts works on gateways with ffmpeg, and shows that name a payout address earn 75% of each paid impression through ads-manager billing (tested end to end on a fake rail). Not built: a DAAST endpoint. Remaining switch: real payouts go through the node's one payment rail (`payments.rs`: CoinPay payouts API, key in `$C0MPUTE_COINPAY_PAYOUT_KEY`) and stay off until the advertiser sets both `[ads] payouts = true` and `[payments] enabled = true` and runs `c0mpute ads settle --pay` (never exercised with real funds; moving third-party money needs Anthony's approval), and the 5% network fee is only owed, not sent, until `[ads] fee_payout` names c0mpute's fee wallet."
builtin     = true
description = "Dynamic ad insertion for c0mpute-hosted podcasts: shows opt in with a signed flag (and payout address) in their own site, any gateway with ffmpeg splices a matching audio ad before, inside or after the episode, and the show is paid for each verified impression."
author      = "Profullstack"
license     = "MIT"
source      = "https://github.com/profullstack/c0mpute/tree/master/node/crates/c0mpute-core/src/ads"
keywords    = ["podcast", "audio", "ads", "advertising", "dai", "dynamic-ad-insertion", "p2p"]

[module.requirements]
c0mpute      = ">=0.2.82"
os           = ["linux", "darwin"]
arch         = ["x86_64", "aarch64"]
capabilities = ["network:ingress", "bin:ffmpeg", "bin:ffprobe"]

[module.requirements.plugins]
ads-manager = ">=0.0.1"     # campaigns, selection, receipts
podcasting  = ">=0.0.1"     # shows as hosting sites; --ads opt-in
hosting     = ">=0.2.72"

[module.workloads]
# None: a serve hook on the gateway's hosting routes.

[module.dispatch]
mode = "in-process"

[module.surfaces]
cli = "c0mpute podcasting publish --ads pre,post --ads-payout SOL:<address>"

[module.config.defaults]
podcast_insertion = true   # [ads] podcast_insertion
max_ad_secs       = 60     # per show: [ads] max_ad_secs
stitch_cache_secs = 600

# Build and publish the CrowdGPT runner image (plugins/crowdgpt/runner).
#
# The image holds CrowdGPT's client (GPL-3.0, unmodified) at the commit pinned
# by ARG CROWDGPT_COMMIT in the Dockerfile, which must equal CROWDGPT_COMMIT in
# node/crates/c0mpute-core/src/crowdgpt.rs (a unit test keeps them equal).
# Nodes pull :crowdgpt-<first 12 of the commit> and refuse any image whose
# org.c0mpute.crowdgpt.commit label differs, so bumping the pin is a reviewed
# PR touching both places; nothing here follows CrowdGPT's main branch.
#
# Visibility: like the video runner, the package must be PUBLIC for outside
# operators to pull it (one manual click by an org admin:
# github.com/orgs/profullstack/packages -> c0mpute-crowdgpt-runner -> Package
# settings -> Change visibility -> Public). Until then `c0mpute crowdgpt
# setup` builds the same image from source.
name: crowdgpt runner

on:
  push:
    branches: [master]
    paths:
      - "plugins/crowdgpt/runner/**"
      - ".github/workflows/crowdgpt-runner.yml"
  pull_request:
    paths:
      - "plugins/crowdgpt/runner/**"
      - ".github/workflows/crowdgpt-runner.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/profullstack/c0mpute-crowdgpt-runner

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Watchdog parses and the pin is consistent
        run: |
          set -eu
          sh -n plugins/crowdgpt/runner/c0mpute-crowdgpt-run
          shellcheck -s sh plugins/crowdgpt/runner/c0mpute-crowdgpt-run || true
          pin=$(sed -n 's/^ARG CROWDGPT_COMMIT=//p' plugins/crowdgpt/runner/Dockerfile)
          grep -q "CROWDGPT_COMMIT: &str = \"$pin\"" node/crates/c0mpute-core/src/crowdgpt.rs
          grep -q "crowdgpt-$(echo "$pin" | cut -c1-12)" plugins/crowdgpt/module.toml
          echo "pinned CrowdGPT commit: $pin"

  build:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          set -eu
          pin=$(sed -n 's/^ARG CROWDGPT_COMMIT=//p' plugins/crowdgpt/runner/Dockerfile)
          short=$(echo "$pin" | cut -c1-12)
          echo "pin=${pin}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:crowdgpt-${short},${IMAGE}:stable,${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build (and push from master)
        id: push
        uses: docker/build-push-action@v6
        with:
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          context: plugins/crowdgpt/runner
          file: plugins/crowdgpt/runner/Dockerfile
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Selftest the image
        # The client starts, reports its version and help, the pinned label is
        # there, and the root filesystem is read-only-safe. No network
        # training: that needs a pool of three volunteers.
        run: |
          set -eu
          ref="${IMAGE}:${GITHUB_SHA}"
          [ "${{ github.event_name }}" = "pull_request" ] || docker pull "$ref"
          label=$(docker image inspect --format '{{ index .Config.Labels "org.c0mpute.crowdgpt.commit" }}' "$ref")
          test "$label" = "${{ steps.tags.outputs.pin }}"
          # As c0mpute runs it: the node user's uid owning the one mount.
          data=$(mktemp -d)
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$data:/data" "$ref" --version
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" -v "$data:/data" "$ref" --help | grep -q -- --headless
          # Default user is not root.
          test "$(docker image inspect --format '{{ .Config.User }}' "$ref")" = "65534:65534"

      - name: Can a stranger pull it?
        if: github.event_name != 'pull_request'
        run: |
          set -u
          export DOCKER_CONFIG="$(mktemp -d)"
          if docker manifest inspect "${IMAGE}:${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "Anonymous pull: OK (package is public)." >> "$GITHUB_STEP_SUMMARY"
          else
            msg="ghcr.io package c0mpute-crowdgpt-runner is not publicly pullable. An org admin must set it Public once. Until then nodes build the runner from source (c0mpute crowdgpt setup)."
            echo "::warning::${msg}"
            echo "Anonymous pull: FAILED. ${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi

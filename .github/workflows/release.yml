name: release

# Tag a release with `git tag v0.1.1 && git push --tags`. This workflow
# builds the c0mpute binary for Linux / macOS / Windows on x86_64 and
# aarch64, packages each as a tarball (zip on Windows), generates a
# SHA-256 checksum, and uploads the lot to a GitHub Release.
#
# The release is created as a DRAFT first, every platform uploads into the
# draft, and only when all five uploads succeeded does the `publish` job make
# it public and mark it Latest. Before this, softprops/action-gh-release
# published + marked Latest on the first upload, so for ~3 minutes after a
# tag `releases/latest/download/<artifact>` 404'd for every platform still
# building, and `curl -fsSL https://c0mpute.com/install.sh | sh` failed.
# Before publishing, the `publish` job signs every artifact with the
# production minisign key (repo secrets MINISIGN_SECRET_KEY + MINISIGN_PASSWORD;
# public key minisign.pub) and uploads <artifact>.minisig next to it, which
# scripts/install.sh requires. A release is never published unsigned.
#
# A failed platform leaves the draft unpublished (Latest stays on the
# previous release); fix and re-run the failed jobs.
#
# Stable install URL: https://c0mpute.com/releases/latest/<artifact>
# redirects to https://github.com/profullstack/c0mpute/releases/latest/download/<artifact>
# (configured in apps/web/next.config.mjs).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.2.33"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  draft:
    name: create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create the release as a draft (or reuse it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$TAG" in v*) ;; *) echo "not a release tag: $TAG" >&2; exit 1 ;; esac
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            echo "release $TAG exists (draft=$(gh release view "$TAG" --json isDraft -q .isDraft)); uploads will replace its assets"
          else
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG"
          fi

  release:
    name: ${{ matrix.platform }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: musl targets produce fully static binaries that run
          # on any Linux distro (no glibc version dependency). Building
          # against glibc on ubuntu-latest (24.04, glibc 2.39) made the
          # v0.1.0 binary unusable on older Linux.
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # Both Mac targets cross-built from the arm64 runner — Intel
          # mac runners (macos-13) have minimal capacity and queue
          # indefinitely. Apple's Xcode toolchain cross-compiles
          # x86_64-apple-darwin natively from arm64.
          - platform: darwin-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - platform: darwin-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Install musl tools (Linux musl targets)
        if: contains(matrix.target, 'linux-musl')
        # 2026-11-11: hosted runners could not resolve *.ubuntu.com for 40+ min
        # (crates.io and GitHub resolved fine), failing v0.3.42 and v0.3.43 on
        # both Linux targets. Fall back to a mirror outside ubuntu.com that
        # carries both the amd64 archive and arm64 ubuntu-ports.
        run: |
          if sudo apt-get update && sudo apt-get install -y musl-tools; then exit 0; fi
          echo "::warning::ubuntu.com mirrors unreachable; retrying via mirrors.ocf.berkeley.edu"
          M=http://mirrors.ocf.berkeley.edu
          # amd64 runners list their mirrors in apt-mirrors.txt (sources say
          # mirror+file:/etc/apt/apt-mirrors.txt), so rewrite that list too.
          if [ -f /etc/apt/apt-mirrors.txt ]; then echo "$M/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt; fi
          sudo sed -i -E \
            -e "s#https?://([a-z0-9.-]+\.)?archive\.ubuntu\.com/ubuntu#$M/ubuntu#g" \
            -e "s#https?://security\.ubuntu\.com/ubuntu#$M/ubuntu#g" \
            -e "s#https?://ports\.ubuntu\.com/ubuntu-ports#$M/ubuntu-ports#g" \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build c0mpute binary
        run: cargo build --release --bin c0mpute --target ${{ matrix.target }}

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          BIN=target/${{ matrix.target }}/release/c0mpute
          ARTIFACT=c0mpute-${{ matrix.platform }}.tar.gz
          tar -czf "$ARTIFACT" -C "$(dirname "$BIN")" c0mpute
          shasum -a 256 "$ARTIFACT" > "$ARTIFACT.sha256"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"
          echo "ARTIFACT_SHA=$ARTIFACT.sha256" >> "$GITHUB_ENV"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/c0mpute.exe"
          $artifact = "c0mpute-${{ matrix.platform }}.zip"
          Compress-Archive -Path $bin -DestinationPath $artifact
          $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLower()
          "$hash  $artifact" | Out-File -Encoding ascii "$artifact.sha256"
          "ARTIFACT=$artifact" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "ARTIFACT_SHA=$artifact.sha256" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ARTIFACT" "$ARTIFACT_SHA" --clobber

  publish:
    name: publish + mark latest
    # Runs only when every platform job succeeded (needs + default success()).
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Only for minisign.pub, the public key every signature must verify against.
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: minisign.pub
          sparse-checkout-cone-mode: false

      # minisign from its upstream release, pinned by sha256 (the same pin
      # scripts/install.sh uses to verify downloads when minisign is missing).
      - name: Install minisign (pinned)
        run: |
          set -eu
          curl -fsSL -o "$RUNNER_TEMP/minisign.tar.gz" https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  $RUNNER_TEMP/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          install -m 755 "$RUNNER_TEMP/minisign-linux/x86_64/minisign" /usr/local/bin/minisign 2>/dev/null \
            || sudo install -m 755 "$RUNNER_TEMP/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
          minisign -v

      # Sign every artifact with the production key (public half: minisign.pub,
      # embedded in scripts/install.sh). Secret key + password live in the
      # MINISIGN_SECRET_KEY / MINISIGN_PASSWORD repo secrets (source of truth:
      # logicsrc team vault c0mpute--signing). Only this job sees them.
      - name: Sign artifacts and upload .minisig files
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          [ -n "$MINISIGN_SECRET_KEY" ] && [ -n "$MINISIGN_PASSWORD" ] || { echo "MINISIGN_SECRET_KEY / MINISIGN_PASSWORD secrets missing; not publishing unsigned" >&2; exit 1; }
          umask 077
          pub="$GITHUB_WORKSPACE/minisign.pub"
          [ -s "$pub" ] || { echo "minisign.pub missing at $TAG; not publishing" >&2; exit 1; }
          work="$RUNNER_TEMP/sign"; mkdir -p "$work"; cd "$work"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$RUNNER_TEMP/minisign.key"' EXIT
          want="c0mpute-linux-x86_64.tar.gz c0mpute-linux-aarch64.tar.gz c0mpute-darwin-x86_64.tar.gz c0mpute-darwin-aarch64.tar.gz c0mpute-windows-x86_64.zip"
          for a in $want; do
            gh release download "$TAG" -p "$a" -p "$a.sha256" --clobber
            # Sign only what the platform build uploaded: check its checksum first.
            sha256sum -c "$a.sha256"
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$a" \
              -t "timestamp:$(date +%s) version:$TAG file:$a" >/dev/null
            # Must verify against the committed public key (minisign.pub).
            minisign -V -p "$pub" -m "$a"
            gh release upload "$TAG" "$a.minisig" --clobber
          done

      - name: Check every asset is on the release, then publish it as Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          want="c0mpute-linux-x86_64.tar.gz c0mpute-linux-aarch64.tar.gz c0mpute-darwin-x86_64.tar.gz c0mpute-darwin-aarch64.tar.gz c0mpute-windows-x86_64.zip"
          have=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for a in $want; do
            for f in "$a" "$a.sha256" "$a.minisig"; do
              echo "$have" | grep -qx "$f" || { echo "missing asset $f on $TAG; not publishing" >&2; exit 1; }
            done
          done
          # Latest only when this tag is the highest release. Re-running the
          # workflow on an old tag (workflow_dispatch) used to move
          # releases/latest, and with it every install and self-update, back
          # to that old version.
          highest=$( { gh release list --limit 300 --json tagName -q '.[].tagName' || true; echo "$TAG"; } \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 )
          if [ "$highest" = "$TAG" ]; then
            gh release edit "$TAG" --draft=false --latest
          else
            echo "::warning::$TAG is not the highest release ($highest); publishing it without moving Latest"
            gh release edit "$TAG" --draft=false --latest=false
          fi
          # The public download URL must now serve every platform.
          for a in $want; do
            for f in "$a" "$a.minisig"; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -L "https://github.com/$GH_REPO/releases/download/$TAG/$f")
              echo "$f -> $code"
              [ "$code" = "200" ] || { echo "asset $f not downloadable after publish" >&2; exit 1; }
            done
          done

  # The desktop app (apps/desktop), built once the CLI release is public and
  # attached to the same release. It bundles the CLI tarball of its own
  # platform from this release (checked against its .sha256), so the app and
  # the `c0mpute` inside it are the same version. Runs after `publish` on
  # purpose: a desktop build failure never holds back a CLI release; re-run
  # the failed job. Unsigned on macOS/Windows until certificates exist (see
  # apps/desktop/electron-builder.yml).
  desktop:
    name: desktop ${{ matrix.platform }}
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            builder: --linux AppImage deb --x64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            builder: --linux AppImage deb --arm64
          - platform: darwin-aarch64
            os: macos-latest
            builder: --mac dmg zip --arm64
          - platform: darwin-x86_64
            os: macos-latest
            builder: --mac dmg zip --x64
          - platform: windows-x86_64
            os: windows-latest
            builder: --win nsis --x64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Bundle the CLI from this release
        working-directory: apps/desktop
        shell: bash
        run: node scripts/fetch-cli.mjs --tag "$TAG" --platform ${{ matrix.platform }}

      - name: Test
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        shell: bash
        run: bun test

      - name: Build and package
        working-directory: apps/desktop
        shell: bash
        env:
          # No signing identity yet: do not let electron-builder go looking.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -eu
          node scripts/ensure-electron.mjs
          node scripts/build.mjs
          npx electron-builder --config electron-builder.yml ${{ matrix.builder }} --publish never -c.extraMetadata.version="${TAG#v}"

      - name: Upload to the release
        working-directory: apps/desktop/release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          shopt -s nullglob
          # A version-less AppImage too, for `install.sh --desktop` via
          # c0mpute.com/releases/latest/c0mpute-desktop-<platform>.AppImage.
          for a in c0mpute-desktop-*.AppImage; do cp "$a" "c0mpute-desktop-${{ matrix.platform }}.AppImage"; break; done
          files=(c0mpute-desktop-*.AppImage c0mpute-desktop-*.deb c0mpute-desktop-*.dmg c0mpute-desktop-*.zip c0mpute-desktop-*.exe)
          [ ${#files[@]} -gt 0 ] || { echo "no desktop artifacts built" >&2; ls -la; exit 1; }
          for f in "${files[@]}"; do
            if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
            gh release upload "$TAG" "$f" "$f.sha256" --clobber
          done

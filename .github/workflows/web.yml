name: web

# apps/web (the c0mpute.com Next.js app): typecheck + bun tests on every PR, so a web-only
# change is tested before it merges (2026-11-22: #485 shipped with tests no CI job ran).
#
# The workflow triggers on every PR on purpose and skips the heavy steps when nothing the
# web app builds from changed: a required check behind a `paths:` filter never reports on
# other PRs and blocks them forever. Pushes to master always run the full job.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: web typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Did the web app change?
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$files" | grep -qE '^(apps/web/|packages/|package\.json$|bun\.lock$|tsconfig\.json$|\.github/workflows/web\.yml$)'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "No apps/web, packages or lockfile changes: skipping."
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.web == 'true'
        with:
          bun-version: "1.3"
      - name: Cache bun packages
        if: steps.changes.outputs.web == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install
        if: steps.changes.outputs.web == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build @c0mpute/shared
        if: steps.changes.outputs.web == 'true'
        run: bun run --cwd packages/shared build
      - name: Typecheck
        if: steps.changes.outputs.web == 'true'
        working-directory: apps/web
        run: bun run lint
      - name: Test
        if: steps.changes.outputs.web == 'true' && !cancelled()
        working-directory: apps/web
        run: bun test

name: apps-distributed-live-verifier

# Pure, read-only validator unit tests. A real multi-host live test is run by
# an operator with explicit --gateway arguments, never against arbitrary
# third-party infrastructure from CI.
on:
  pull_request:
    paths:
      - "scripts/verify-distributed-app.py"
      - ".github/workflows/apps-distributed-live-verifier.yml"
  push:
    branches: [master]
    paths:
      - "scripts/verify-distributed-app.py"
      - ".github/workflows/apps-distributed-live-verifier.yml"

permissions:
  contents: read

jobs:
  verifier:
    name: distributed app verification self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile verifier
        run: python3 -m py_compile scripts/verify-distributed-app.py
      - name: Test failure modes and gateway consensus
        run: python3 scripts/verify-distributed-app.py --self-test
